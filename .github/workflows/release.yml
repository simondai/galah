name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Galah.sln -c Release

      - name: Unit tests
        run: dotnet run --project Galah.Tests -c Release --no-build

      - name: Publish single-file exe
        run: >
          dotnet publish Galah/Galah.csproj -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o artifact

      - name: Upload artifact (CI runs)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: Galah-windows-x64
          path: artifact/Galah.exe
          retention-days: 14

      - name: Attach to release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifact/Galah.exe
          generate_release_notes: true
